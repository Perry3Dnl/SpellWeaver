name: Deploy SpellWeaver
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: spellweaver-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_HOST_KEY_FINGERPRINT: ${{ vars.DEPLOY_HOST_KEY_FINGERPRINT || 'SHA256:Vq5Cic1/9iZsNAXfG9GQlnOjciecd6V9BPLGV5X2ExE' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: Require configured SSH identity
        shell: bash
        run: |
          set -euo pipefail
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_HOST_KEY_FINGERPRINT OPENAI_API_KEY; do
            test -n "${!key:-}" || { echo "Missing $key" >&2; exit 1; }
          done
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_.-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
      - name: Upload isolated release with pinned SSH identity
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          mkdir -p "$RUNNER_TEMP/sw-ssh"
          chmod 700 "$RUNNER_TEMP/sw-ssh"
          printf '%s\n' "$DEPLOY_PASSWORD" > "$RUNNER_TEMP/sw-ssh/password"
          chmod 600 "$RUNNER_TEMP/sw-ssh/password"
          ssh-keyscan -T 15 -p "$DEPLOY_PORT" -t ed25519 "$DEPLOY_HOST" > "$RUNNER_TEMP/sw-ssh/known_hosts" 2>/dev/null
          test -s "$RUNNER_TEMP/sw-ssh/known_hosts"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/sw-ssh/known_hosts" -E sha256 | awk 'NR==1 {print $2}')" = "$DEPLOY_HOST_KEY_FINGERPRINT" || { echo 'SSH host fingerprint mismatch' >&2; exit 1; }
          SSH_OPTS=(-o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/sw-ssh/known_hosts" -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive -p "$DEPLOY_PORT")
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          umask 077
          # Config is only on the runner and private host directory; never bundled in dist.
          printf 'SPELLWEAVER_DEMO_USERNAME=bob\nOPENAI_API_KEY=%s\n' \
            "$OPENAI_API_KEY" > "$RUNNER_TEMP/sw-ssh/runtime.env"
          tar -czf "$RUNNER_TEMP/spellweaver.tar.gz" -C dist .
          # This transfer touches only /opt/spellweaver. It never overwrites the shared Caddyfile.
          sshpass -f "$RUNNER_TEMP/sw-ssh/password" ssh "${SSH_OPTS[@]}" "$remote" "mkdir -p /opt/spellweaver/deploy /opt/spellweaver/private && chmod 700 /opt/spellweaver/private"
          sshpass -f "$RUNNER_TEMP/sw-ssh/password" scp -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/sw-ssh/known_hosts" -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive -P "$DEPLOY_PORT" \
            "$RUNNER_TEMP/sw-ssh/runtime.env" "$remote:/opt/spellweaver/private/runtime.env"
          sshpass -f "$RUNNER_TEMP/sw-ssh/password" scp -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/sw-ssh/known_hosts" -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive -P "$DEPLOY_PORT" \
            "$RUNNER_TEMP/spellweaver.tar.gz" "$remote:/opt/spellweaver/.release-$GITHUB_SHA.tar.gz"
          sshpass -f "$RUNNER_TEMP/sw-ssh/password" scp -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/sw-ssh/known_hosts" -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive -P "$DEPLOY_PORT" \
            deploy/remote-deploy.sh deploy/caddy-update.py "$remote:/opt/spellweaver/deploy/"
          sshpass -f "$RUNNER_TEMP/sw-ssh/password" ssh "${SSH_OPTS[@]}" "$remote" "bash /opt/spellweaver/deploy/remote-deploy.sh '$GITHUB_SHA'"
      - name: Verify domain serves exact deployed revision
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            if curl -fsSL --max-time 12 -H 'Cache-Control: no-cache' "https://spellweaver.perry3d.nl/version.json?revision=$GITHUB_SHA" | grep -Fq "$GITHUB_SHA";then
              test "$(curl -sS --max-time 12 -o /dev/null -w '%{http_code}' https://spellweaver.perry3d.nl/)" = "302" || exit 1
              curl -fsSL --max-time 12 https://spellweaver.perry3d.nl/login | grep -Fq 'SpellWeaver' && exit 0
            fi
            sleep 3
          done
          echo 'Live revision verification failed; inspect isolated service and existing Caddy route.' >&2
          exit 1
