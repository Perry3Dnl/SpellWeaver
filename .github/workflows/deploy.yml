name: Deploy SpellWeaver
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: spellweaver-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_HOST_KEY_FINGERPRINT: ${{ vars.DEPLOY_HOST_KEY_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: Require configured SSH identity
        shell: bash
        run: |
          set -euo pipefail
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_HOST_KEY_FINGERPRINT; do
            test -n "${!key:-}" || { echo "Missing $key" >&2; exit 1; }
          done
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_.-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
      - name: Upload isolated release with pinned SSH identity
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          mkdir -p "$RUNNER_TEMP/sw-ssh"
          chmod 700 "$RUNNER_TEMP/sw-ssh"
          printf '%s\n' "$DEPLOY_PASSWORD" > "$RUNNER_TEMP/sw-ssh/password"
          chmod 600 "$RUNNER_TEMP/sw-ssh/password"
          ssh-keyscan -T 15 -p "$DEPLOY_PORT" -t ed25519 "$DEPLOY_HOST" > "$RUNNER_TEMP/sw-ssh/known_hosts" 2>/dev/null
          test -s "$RUNNER_TEMP/sw-ssh/known_hosts"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/sw-ssh/known_hosts" -E sha256 | awk 'NR==1 {print $2}')" = "$DEPLOY_HOST_KEY_FINGERPRINT" || { echo 'SSH host fingerprint mismatch' >&2; exit 1; }
          SSH_OPTS=(-o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/sw-ssh/known_hosts" -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive -p "$DEPLOY_PORT")
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          tar -czf "$RUNNER_TEMP/spellweaver.tar.gz" -C dist .
          sshpass -f "$RUNNER_TEMP/sw-ssh/password" ssh "${SSH_OPTS[@]}" "$remote" "mkdir -p /opt/spellweaver/releases/$GITHUB_SHA"
          sshpass -f "$RUNNER_TEMP/sw-ssh/password" scp -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/sw-ssh/known_hosts" -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive -P "$DEPLOY_PORT" "$RUNNER_TEMP/spellweaver.tar.gz" "$remote:/opt/spellweaver/releases/$GITHUB_SHA/release.tar.gz"
          sshpass -f "$RUNNER_TEMP/sw-ssh/password" ssh "${SSH_OPTS[@]}" "$remote" "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          revision="$1"
          app_dir=/opt/spellweaver
          tar -xzf "$app_dir/releases/$revision/release.tar.gz" -C "$app_dir/releases/$revision"
          rm -f "$app_dir/releases/$revision/release.tar.gz"
          # Only this application path is modified; never replace the shared Caddyfile.
          if [ ! -e "$app_dir/current" ];then ln -s "$app_dir/releases/$revision" "$app_dir/current";else ln -sfn "$app_dir/releases/$revision" "$app_dir/.current-next";mv -Tf "$app_dir/.current-next" "$app_dir/current";fi
          if systemctl list-unit-files spellweaver.service --no-legend 2>/dev/null | grep -q '^spellweaver.service';then
            sudo systemctl restart spellweaver.service
          else
            echo 'Dedicated spellweaver.service not installed; refusing to change Caddy or unrelated services.' >&2
            exit 1
          fi
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:18087/version.json
          REMOTE
      - name: Verify domain serves exact deployed revision
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            if curl -fsSL --max-time 12 -H 'Cache-Control: no-cache' "https://spellweaver.perry3d.nl/version.json?revision=$GITHUB_SHA" | grep -Fq "$GITHUB_SHA";then
              curl -fsSL --max-time 12 https://spellweaver.perry3d.nl/ | grep -Fq 'SPELLWEAVER' && exit 0
            fi
            sleep 3
          done
          echo 'Live revision verification failed; inspect isolated service and existing Caddy route.' >&2
          exit 1
