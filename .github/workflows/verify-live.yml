name: Verify live SpellWeaver and shared routes
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact published version
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 40); do
            if curl -fsSL --max-time 12 -H 'Cache-Control: no-cache' 'https://spellweaver.perry3d.nl/version.json' -o /tmp/sw-version.json 2>/dev/null; then
              revision="$(python3 -c 'import json;print(json.load(open("/tmp/sw-version.json")).get("revision",""))' 2>/dev/null || true)"
              if [ "$revision" = "$GITHUB_SHA" ]; then ready=true; break; fi
            fi
            sleep 5
          done
          [ "$ready" = true ] || { echo 'Live site does not serve this commit' >&2; exit 1; }
      - name: Verify private login, session and AI readiness
        shell: bash
        run: |
          set -euo pipefail
          base=https://spellweaver.perry3d.nl
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$base/")" = 302
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$base/app.js")" = 401
          curl -fsSL --max-time 20 "$base/login" -o /tmp/sw-login.html
          grep -Fq 'id="login"' /tmp/sw-login.html
          curl -fsSL --max-time 20 "$base/login.js" | grep -Fq '/api/login'
          # Public login is checked without putting the shared demo credential in CI logs.
          curl -fsSL --max-time 20 "$base/api/session" >/tmp/sw-session-public.json
                    python3 - <<'PY'
          import json
          session=json.load(open('/tmp/sw-session.json'))
          assert session.get('authenticated') is False
          assert isinstance(session.get('aiEnabled'), bool)
          PY
      - name: Verify HTML renders with browser JavaScript
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1;then browser=google-chrome
          elif command -v chromium >/dev/null 2>&1;then browser=chromium
          else
            echo 'No chromium-family browser available; JS browser verification unavailable' >&2
            exit 1
          fi
          "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=8000 --dump-dom 'https://spellweaver.perry3d.nl/login' \
            > /tmp/sw-rendered.html
          grep -Fq 'id="login"' /tmp/sw-rendered.html
          grep -Fq 'name="username"' /tmp/sw-rendered.html
          grep -Fq 'name="password"' /tmp/sw-rendered.html
      - name: Ensure other shared Caddy routes remain reachable
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            'https://perry3d.nl/health' \
            'https://metelkaar.online/api/health' \
            'https://stocks.perry3d.nl/' \
            'https://house.perry3d.nl/'
          do
            code="$(curl -sS -L --max-time 25 -o /dev/null -w '%{http_code}' "$url")" || {
              echo "Shared route unreachable: $url" >&2
              exit 1
            }
            echo "Shared route $url => HTTP $code"
            case "$code" in
              2??|3??|401|403|404) ;;
              *) echo "Shared route unhealthy: $url => $code" >&2;exit 1;;
            esac
          done
